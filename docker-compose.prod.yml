services:
  postgres-user:
    image: postgres:16
    restart: unless-stopped
    env_file: .env.prod
    environment:
      POSTGRES_DB: userdb
    volumes:
      - pg_user_data:/var/lib/postgresql/data
    networks: [rbs-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres-restaurant:
    image: postgres:16
    restart: unless-stopped
    env_file: .env.prod
    environment:
      POSTGRES_DB: restaurantdb
    volumes:
      - pg_restaurant_data:/var/lib/postgresql/data
    networks: [rbs-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres-booking:
    image: postgres:16
    restart: unless-stopped
    env_file: .env.prod
    environment:
      POSTGRES_DB: bookingdb
    volumes:
      - pg_booking_data:/var/lib/postgresql/data
    networks: [rbs-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres-notification:
    image: postgres:16
    restart: unless-stopped
    env_file: .env.prod
    environment:
      POSTGRES_DB: notificationdb
    volumes:
      - pg_notification_data:/var/lib/postgresql/data
    networks: [rbs-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks: [rbs-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    env_file: .env.prod
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
    volumes:
      - minio_data:/data
    networks: [rbs-net]

  minio-init:
    image: minio/mc:latest
    restart: "no"
    env_file: .env.prod
    depends_on:
      - minio
    networks: [rbs-net]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do
        echo 'waiting for minio...';
        sleep 2;
      done &&
      for bucket in $$MINIO_BUCKET restaurant-media dish-media; do
        echo \"creating bucket: $$bucket\";
        mc mb -p local/$$bucket || true;
        mc anonymous set download local/$$bucket || true;
      done
      "

  kafka:
    image: apache/kafka:latest
    restart: unless-stopped
    env_file: .env.prod
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks: [rbs-net]

  eureka-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: eureka-server
    restart: unless-stopped
    env_file: .env.prod
    networks: [rbs-net]

  user-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: user-service
    restart: unless-stopped
    env_file: .env.prod
    depends_on:
      postgres-user:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks: [rbs-net]

  restaurant-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: restaurant-service
    restart: unless-stopped
    env_file: .env.prod
    depends_on:
      postgres-restaurant:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      eureka-server:
        condition: service_started
    networks: [rbs-net]

  booking-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: booking-service
    restart: unless-stopped
    env_file: .env.prod
    depends_on:
      postgres-booking:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      eureka-server:
        condition: service_started
    networks: [rbs-net]

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: notification-service
    restart: unless-stopped
    env_file: .env.prod
    depends_on:
      postgres-notification:
        condition: service_healthy
      kafka:
        condition: service_started
      eureka-server:
        condition: service_started
    networks: [rbs-net]

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: api-gateway
    restart: unless-stopped
    env_file: .env.prod
    ports:
      - "8080:8080"
    depends_on:
      eureka-server:
        condition: service_started
      user-service:
        condition: service_started
      restaurant-service:
        condition: service_started
      booking-service:
        condition: service_started
      notification-service:
        condition: service_started
    networks: [rbs-net]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api-gateway
    networks: [rbs-net]

networks:
  rbs-net:
    name: rbs-net
    driver: bridge

volumes:
  pg_user_data:
  pg_restaurant_data:
  pg_booking_data:
  pg_notification_data:
  redis_data:
  minio_data:
  kafka_data: