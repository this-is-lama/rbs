# ---------- Бэкапы Postgres: общие настройки ----------
x-pg-backup: &pg-backup
  image: prodrigestivill/postgres-backup-local:16
  restart: unless-stopped
  env_file: .env.prod                  # POSTGRES_USER / POSTGRES_PASSWORD
  networks: [rbs-net]

x-pg-backup-env: &pg-backup-env
  TZ: Europe/Moscow
  SCHEDULE: "0 3 * * *"            # каждый день в 03:00 по Москве
  BACKUP_KEEP_DAYS: 7              # хранить 7 ежедневных копий
  BACKUP_KEEP_WEEKS: 4             # 4 еженедельных
  BACKUP_KEEP_MONTHS: 6            # 6 ежемесячных

services:
  postgres-user:
    image: postgres:16
    restart: unless-stopped
    env_file: .env.prod
    environment:
      POSTGRES_DB: userdb
    volumes:
      - pg_user_data:/var/lib/postgresql/data
    networks: [rbs-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres-restaurant:
    image: postgres:16
    restart: unless-stopped
    env_file: .env.prod
    environment:
      POSTGRES_DB: restaurantdb
    volumes:
      - pg_restaurant_data:/var/lib/postgresql/data
    networks: [rbs-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres-booking:
    image: postgres:16
    restart: unless-stopped
    env_file: .env.prod
    environment:
      POSTGRES_DB: bookingdb
    volumes:
      - pg_booking_data:/var/lib/postgresql/data
    networks: [rbs-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres-notification:
    image: postgres:16
    restart: unless-stopped
    env_file: .env.prod
    environment:
      POSTGRES_DB: notificationdb
    volumes:
      - pg_notification_data:/var/lib/postgresql/data
    networks: [rbs-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres-telegram-bot:
    image: postgres:16
    restart: unless-stopped
    env_file: .env.prod
    environment:
      POSTGRES_DB: telegrambotdb
    volumes:
      - pg_telegram_bot_data:/var/lib/postgresql/data
    networks: [rbs-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks: [rbs-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    env_file: .env.prod
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
    volumes:
      - minio_data:/data
    networks: [rbs-net]

  minio-init:
    image: minio/mc:latest
    restart: "no"
    env_file: .env.prod
    depends_on:
      - minio
    networks: [rbs-net]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do
        echo 'waiting for minio...';
        sleep 2;
      done &&
      for bucket in $$MINIO_BUCKET restaurant-media dish-media; do
        echo \"creating bucket: $$bucket\";
        mc mb -p local/$$bucket || true;
        mc anonymous set download local/$$bucket || true;
      done
      "

  kafka:
    image: apache/kafka:4.3.1   # версия зафиксирована: latest может без предупреждения обновиться до новой мажорной
    restart: unless-stopped
    env_file: .env.prod
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks: [rbs-net]

  eureka-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: eureka-server
    restart: unless-stopped
    env_file: .env.prod
    networks: [rbs-net]

  user-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: user-service
    restart: unless-stopped
    env_file: .env.prod
    environment:
      OTLP_TRACING_ENDPOINT: http://tempo:4318/v1/traces   # куда слать спаны (Tempo)
    depends_on:
      postgres-user:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks: [rbs-net]

  restaurant-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: restaurant-service
    restart: unless-stopped
    env_file: .env.prod
    environment:
      OTLP_TRACING_ENDPOINT: http://tempo:4318/v1/traces   # куда слать спаны (Tempo)
    depends_on:
      postgres-restaurant:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      eureka-server:
        condition: service_started
    networks: [rbs-net]

  booking-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: booking-service
    restart: unless-stopped
    env_file: .env.prod
    environment:
      OTLP_TRACING_ENDPOINT: http://tempo:4318/v1/traces   # куда слать спаны (Tempo)
    depends_on:
      postgres-booking:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      eureka-server:
        condition: service_started
    networks: [rbs-net]

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: notification-service
    restart: unless-stopped
    env_file: .env.prod
    environment:
      OTLP_TRACING_ENDPOINT: http://tempo:4318/v1/traces   # куда слать спаны (Tempo)
    depends_on:
      postgres-notification:
        condition: service_healthy
      kafka:
        condition: service_started
      eureka-server:
        condition: service_started
    networks: [rbs-net]

  telegram-bot-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: telegram-bot-service
    restart: unless-stopped
    env_file: .env.prod
    environment:
      OTLP_TRACING_ENDPOINT: http://tempo:4318/v1/traces   # куда слать спаны (Tempo)
    # только одна реплика: один токен бота может опрашивать Telegram только из одного места
    depends_on:
      postgres-telegram-bot:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks: [rbs-net]

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: api-gateway
    restart: unless-stopped
    env_file: .env.prod
    environment:
      OTLP_TRACING_ENDPOINT: http://tempo:4318/v1/traces   # куда слать спаны (Tempo)
    ports:
      - "8080:8080"
    depends_on:
      eureka-server:
        condition: service_started
      user-service:
        condition: service_started
      restaurant-service:
        condition: service_started
      booking-service:
        condition: service_started
      notification-service:
        condition: service_started
    networks: [rbs-net]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://restaurant-booking.ru:8080}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api-gateway
    networks: [rbs-net]

  # ---------- Мониторинг ----------
  # Порты открыты только на 127.0.0.1 — снаружи сервера не видны.
  # Доступ через SSH-туннель: ssh -L 3000:localhost:3000 user@server → http://localhost:3000
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--storage.tsdb.retention.size=5GB"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks: [rbs-net]

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    env_file: .env.prod   # GF_SECURITY_ADMIN_USER / GF_SECURITY_ADMIN_PASSWORD, TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID
    environment:
      # Не скачивать и не обновлять плагины с grafana.com при старте: встроенные Prometheus/Loki/Tempo
      # уже есть в образе, а фоновое обновление даёт "Could not load plugin" на дашбордах
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - loki
      - tempo
    networks: [rbs-net]

  node-exporter:
    image: prom/node-exporter:latest
    restart: unless-stopped
    command:
      - "--path.rootfs=/host"
    volumes:
      - /:/host:ro,rslave
    pid: host
    networks: [rbs-net]

  tempo:
    image: grafana/tempo:3.0.3
    restart: unless-stopped
    command: ["-target=all", "-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./monitoring/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    networks: [ rbs-net ]

  loki:
    image: grafana/loki:latest
    restart: unless-stopped
    command:
      - "-config.file=/etc/loki/loki-config.yml"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    networks: [rbs-net]

  alloy:
    image: grafana/alloy:latest
    restart: unless-stopped
    command:
      - "run"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "--storage.path=/var/lib/alloy/data"
      - "/etc/alloy/config.alloy"
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki
    networks: [rbs-net]

  # ---------- Бэкапы Postgres ----------
  backup-user:
    <<: *pg-backup
    environment:
      <<: *pg-backup-env
      POSTGRES_HOST: postgres-user
      POSTGRES_DB: userdb
    volumes:
      - ./backups/user:/backups
      - ./scripts/backup-hooks/10-telegram:/hooks/10-telegram:ro
    depends_on:
      postgres-user:
        condition: service_healthy

  backup-restaurant:
    <<: *pg-backup
    environment:
      <<: *pg-backup-env
      POSTGRES_HOST: postgres-restaurant
      POSTGRES_DB: restaurantdb
    volumes:
      - ./backups/restaurant:/backups
      - ./scripts/backup-hooks/10-telegram:/hooks/10-telegram:ro
    depends_on:
      postgres-restaurant:
        condition: service_healthy

  backup-booking:
    <<: *pg-backup
    environment:
      <<: *pg-backup-env
      POSTGRES_HOST: postgres-booking
      POSTGRES_DB: bookingdb
    volumes:
      - ./backups/booking:/backups
      - ./scripts/backup-hooks/10-telegram:/hooks/10-telegram:ro
    depends_on:
      postgres-booking:
        condition: service_healthy

  backup-notification:
    <<: *pg-backup
    environment:
      <<: *pg-backup-env
      POSTGRES_HOST: postgres-notification
      POSTGRES_DB: notificationdb
    volumes:
      - ./backups/notification:/backups
      - ./scripts/backup-hooks/10-telegram:/hooks/10-telegram:ro
    depends_on:
      postgres-notification:
        condition: service_healthy

  backup-telegram-bot:
    <<: *pg-backup
    environment:
      <<: *pg-backup-env
      POSTGRES_HOST: postgres-telegram-bot
      POSTGRES_DB: telegrambotdb
    volumes:
      - ./backups/telegram-bot:/backups
      - ./scripts/backup-hooks/10-telegram:/hooks/10-telegram:ro
    depends_on:
      postgres-telegram-bot:
        condition: service_healthy

  # ---------- Копирование бэкапов в Яндекс Диск (зашифрованно) ----------
  backup-upload:
    image: rclone/rclone:1.71
    restart: unless-stopped
    environment:
      TZ: Europe/Moscow
    volumes:
      - ./backups:/backups:ro          # только читаем бэкапы
      - ./rclone:/config/rclone        # rclone.conf (не в git!), rclone обновляет в нём токен
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          echo "$$(date '+%F %T') upload start"
          rclone copy /backups yadisk-crypt: \
            --filter "- *-latest.sql.gz" --filter "+ /*/last/**" --filter "- **" \
            --log-level INFO \
          && rclone delete yadisk-crypt: --min-age 30d --log-level INFO \
          || echo "$$(date '+%F %T') UPLOAD FAILED"
          sleep 3600
        done
    networks: [rbs-net]

networks:
  rbs-net:
    name: rbs-net
    driver: bridge

volumes:
  pg_user_data:
  pg_restaurant_data:
  pg_booking_data:
  pg_notification_data:
  pg_telegram_bot_data:
  redis_data:
  minio_data:
  kafka_data:
  prometheus_data:
  grafana_data:
  loki-data:
  alloy-data:
  tempo_data:
