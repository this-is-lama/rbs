server:
  port: 0

spring:
  application:
    name: telegram-bot-service
  profiles:
    default: dev

  datasource:
    url: jdbc:postgresql://${TELEGRAM_BOT_DB_HOST}:${TELEGRAM_BOT_DB_PORT}/telegrambotdb
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${TELEGRAM_BOT_MAX_POOL_SIZE:5}   # бот обрабатывает сообщения в одном потоке, много соединений не нужно
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 1800000

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

app:
  telegram:
    # false — сервис стартует, но не опрашивает Telegram (удобно, если этот же токен уже слушает другой экземпляр)
    enabled: ${TELEGRAM_BOT_ENABLED:true}
    token: ${TELEGRAM_BOT_TOKEN}
    # чат, куда приходят обращения; по умолчанию тот же, что и для алертов Grafana
    support-chat-id: ${TELEGRAM_SUPPORT_CHAT_ID:${TELEGRAM_CHAT_ID}}
    api-url: https://api.telegram.org
    poll-timeout: 50s
  support:
    max-tickets-per-day: 5        # сколько новых обращений один пользователь может создать за сутки
    max-attachments: 5            # сколько скриншотов/файлов можно приложить к обращению
    min-text-length: 5
    max-text-length: 3000
    draft-ttl: 30m                # незаконченное обращение забывается через 30 минут тишины
    site-url: https://restaurant-booking.ru

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL}
    # как часто забирать свежую копию реестра (дефолт 30 с)
    registry-fetch-interval-seconds: 10
  instance:
    instance-id: ${spring.application.name}:${random.uuid}
    prefer-ip-address: true
    # как часто шлём Eureka "я жив" (дефолт 30 с)
    lease-renewal-interval-in-seconds: 10
    # через сколько секунд без heartbeat нас считают мёртвым (дефолт 90 с) ≈ 3 пропущенных heartbeat'а
    lease-expiration-duration-in-seconds: 30

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    resource-attributes:
      "[service.instance.id]": ${HOSTNAME:local}
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        enabled: false   # метрики забирает Prometheus
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

---

spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true

logging:
  level:
    root: INFO
    my.project.telegrambotservice: DEBUG
    org.hibernate.SQL: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%level] [%X{traceId:-},%X{spanId:-}] [%thread] %logger{36} - %msg%n"

---

spring:
  config:
    activate:
      on-profile: test
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    root: WARN
    my.project.telegrambotservice: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%level] [%X{traceId:-},%X{spanId:-}] [%thread] %logger{36} - %msg%n"

management:
  tracing:
    export:
      enabled: false

---

spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    root: INFO
    my.project.telegrambotservice: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%level] [%X{traceId:-},%X{spanId:-}] [%thread] %logger{36} - %msg%n"
