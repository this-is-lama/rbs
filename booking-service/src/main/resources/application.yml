server:
  port: 0

jwt:
  access-secret: ${JWT_SECRET}
  issuer: user-service

spring:
  application:
    name: booking-service
  profiles:
    default: dev

  cloud:
    openfeign:
      client:
        config:
          restaurant-service:
            connect-timeout: 1000   # 1 с на установку соединения
            read-timeout: 3000
          user-service:
            connect-timeout: 1000
            read-timeout: 3000
    loadbalancer:
      cache:
        enabled: true
        caffeine:
          spec: maximumSize=1000,expireAfterWrite=30s

  datasource:
    url: jdbc:postgresql://${BOOKING_DB_HOST}:${BOOKING_DB_PORT}/bookingdb
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${MAX_POOL_SIZE:25}
      minimum-idle: ${MIN_IDLE:5}
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 1800000


  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 50
        order_inserts: true
        order_updates: true
        jdbc:
          batch_size: 50

  data:
    redis:
      repositories:
        enabled: false
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        spring.json.add.type.headers: false

app:
  kafka:
    topics:
      booking-created: booking-created-topic
      booking-cancelled: booking-cancelled-topic

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL}
    # как часто забирать свежую копию реестра (дефолт 30 с)
    registry-fetch-interval-seconds: 10
  instance:
    instance-id: ${spring.application.name}:${random.uuid}
    prefer-ip-address: true
    # как часто шлём Eureka "я жив" (дефолт 30 с)
    lease-renewal-interval-in-seconds: 10
    # через сколько секунд без heartbeat нас считают мёртвым (дефолт 90 с) ≈ 3 пропущенных heartbeat'а
    lease-expiration-duration-in-seconds: 30


resilience4j:
  # ---------- Circuit Breaker: перестаёт звать сервис, если тот сбоит ----------
  # CLOSED (всё ок, считаем ошибки) -> OPEN (сразу отказ, в сеть не идём) -> HALF_OPEN (пробные вызовы) -> CLOSED/OPEN
  circuitbreaker:
    configs:
      default:
        # как считать окно: COUNT_BASED — последние N вызовов, TIME_BASED — вызовы за последние N секунд
        sliding-window-type: COUNT_BASED
        # размер окна: breaker смотрит на последние 10 вызовов
        sliding-window-size: 10
        # пока вызовов меньше 5 — ничего не решаем (иначе 1 ошибка из 1 = 100% и сразу OPEN)
        minimum-number-of-calls: 5
        # >= 50% ошибок в окне -> OPEN
        failure-rate-threshold: 50
        # вызов дольше 2 с считается медленным, даже если ответ успешный
        slow-call-duration-threshold: 2s
        # >= 50% медленных вызовов в окне -> OPEN (ловит зависание без ошибок)
        slow-call-rate-threshold: 50
        # сколько держим OPEN (отказываем мгновенно), потом сами переходим в HALF_OPEN
        wait-duration-in-open-state: 10s
        # сколько пробных вызовов пропускаем в HALF_OPEN; по их результату -> CLOSED или снова OPEN
        permitted-number-of-calls-in-half-open-state: 3
        # эти исключения НЕ считаются сбоем:
        # ApiException — сервис ответил ошибкой (404, 409...), значит он жив
        ignore-exceptions:
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
          - my.project.common.exception.ApiException
    instances:
      # имя = @CircuitBreaker(name = "...") в коде; base-config — берём настройки из configs.default
      restaurantService:
        base-config: default
      userService:
        base-config: default

  # ---------- Retry: повторяет вызов при кратковременном сбое ----------
  # Порядок по умолчанию: Retry( CircuitBreaker( вызов ) ) — каждая попытка считается в окне breaker'а
  retry:
    configs:
      default:
        # всего попыток ВМЕСТЕ с первой: 1 обычная + 2 повтора
        # помни: худшее ожидание = max-attempts * read-timeout (3 * 3 с ≈ 9 с + паузы)
        max-attempts: 3
        # пауза перед первым повтором
        wait-duration: 200ms
        # каждая следующая пауза длиннее: 200 мс -> 400 мс (не добиваем больной сервис)
        enable-exponential-backoff: true
        # во сколько раз растёт пауза
        exponential-backoff-multiplier: 2
        # повторяем ТОЛЬКО эти ошибки: RetryableException = таймаут/обрыв соединения ("не ответил")
        retry-exceptions:
          - feign.RetryableException
        # никогда не повторяем:
        # CallNotPermittedException — breaker в OPEN, повтор тоже получит отказ
        # ApiException — сервис ответил ошибкой, повтор даст тот же ответ
        ignore-exceptions:
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
          - my.project.common.exception.ApiException
    instances:
      # имя = @Retry(name = "...") в коде
      restaurantService:
        base-config: default
      userService:
        base-config: default

management:
  # Не трассируем внутренние шаги Spring Security — без них трейс запроса читается проще
  observations:
    enable:
      "[spring.security]": false
  # Гистограмма времени ответа: на дашборде появляются p50/p95/p99, а не только среднее
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
  # ---------- Распределённый трейсинг (Micrometer Tracing + OpenTelemetry -> Tempo) ----------
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}   # доля запросов, попадающих в трейсинг (1.0 = все)
  opentelemetry:
    resource-attributes:
      "[service.instance.id]": ${HOSTNAME:local}          # id реплики (в Docker = id контейнера)
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        enabled: false   # стартер OpenTelemetry умеет слать и метрики, но их у нас забирает Prometheus
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      show-details: always

---

spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: INFO
    my.project.bookingservice: DEBUG
    org.springframework.security: INFO
    org.springframework.kafka: INFO
    org.hibernate.SQL: INFO
    org.springframework.cache: INFO
    org.springframework.data.redis: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%level] [%X{traceId:-},%X{spanId:-}] [%thread] %logger{36} - %msg%n"

---

spring:
  config:
    activate:
      on-profile: test
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    root: WARN
    my.project.bookingservice: WARN
    org.springframework.security: WARN
    org.springframework.kafka: WARN
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    org.springframework.cache: WARN
    org.springframework.data.redis: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%level] [%X{traceId:-},%X{spanId:-}] [%thread] %logger{36} - %msg%n"

management:
  tracing:
    export:
      enabled: false   # в тестах спаны никуда не отправляем

---

spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    root: INFO
    my.project.bookingservice: INFO
    org.springframework.security: WARN
    org.springframework.kafka: WARN
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    org.springframework.cache: WARN
    org.springframework.data.redis: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%level] [%X{traceId:-},%X{spanId:-}] [%thread] %logger{36} - %msg%n"