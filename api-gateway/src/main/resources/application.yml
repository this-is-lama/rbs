server:
  port: 8080

jwt:
  access-secret: ${JWT_SECRET}
  issuer: user-service

app:
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN}

spring:
  reactor:
    context-propagation: auto   # traceId в MDC/логах для реактивного кода (WebFlux)

  application:
    name: api-gateway
  profiles:
    default: dev

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}


  cloud:
    loadbalancer:
      cache:
        enabled: true
        caffeine:
          spec: maximumSize=1000,expireAfterWrite=10s
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false

          default-filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@rateLimiterKeyResolver}"

          routes:
            - id: user-auth-route
              uri: lb://user-service
              predicates:
                - Path=/api/v1/auth/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 5
                    redis-rate-limiter.burstCapacity: 10
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@rateLimiterKeyResolver}"

                - name: CircuitBreaker
                  args:
                    name: userService
                    fallbackUri: forward:/fallback/users

            - id: user-route
              uri: lb://user-service
              predicates:
                - Path=/api/v1/users/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: userService
                    fallbackUri: forward:/fallback/users

            - id: restaurant-route
              uri: lb://restaurant-service
              predicates:
                - Path=/api/v1/restaurants/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: restaurantService
                    fallbackUri: forward:/fallback/restaurants

            - id: dish-photo-route
              uri: lb://restaurant-service
              predicates:
                - Path=/api/v1/dishes/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: dishPhoto   # отдельный breaker: загрузка фото долгая, ей нужен свой таймаут
                    fallbackUri: forward:/fallback/restaurants

            - id: booking-route
              uri: lb://booking-service
              predicates:
                - Path=/api/v1/bookings/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: bookingService                    # имя breaker'а → его настройки в resilience4j.*
                    fallbackUri: forward:/fallback/booking


          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:5173"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"
                allowCredentials: true

resilience4j:
  # ---------- Circuit Breaker на маршрутах: защищает сам Gateway от зависшего сервиса ----------
  # сбоем считается только "нет ответа" (таймаут, отказ соединения); ответ 4xx/5xx уходит клиенту как есть
  circuitbreaker:
    configs:
      default:
        # размер окна: breaker смотрит на последние 10 запросов (дефолт 100 — при нашем трафике не сработал бы)
        sliding-window-size: 10
        # пока запросов меньше 5 — ничего не решаем
        minimum-number-of-calls: 5
        # >= 50% сбоев в окне -> OPEN
        failure-rate-threshold: 50
        # сколько держим OPEN (сразу fallback), потом HALF_OPEN (дефолт 60 с)
        wait-duration-in-open-state: 10s
        # сколько пробных запросов в HALF_OPEN
        permitted-number-of-calls-in-half-open-state: 3
    instances:
      # имя = args.name у фильтра CircuitBreaker в маршруте
      bookingService:
        base-config: default
      restaurantService:
        base-config: default
      userService:
        base-config: default
      dishPhoto:
        base-config: default

  # ---------- TimeLimiter: сколько Gateway ждёт ответа (ДЕФОЛТ 1 с — для нас мало) ----------
  # правило: внешний таймаут > внутреннего, иначе клиент получит 503, а сервис всё равно доделает операцию
  timelimiter:
    instances:
      bookingService:
        # внутри booking-service -> restaurant-service: 3 попытки * 3 с + паузы ≈ 9,6 с
        timeout-duration: 12s
      restaurantService:
        # внутри restaurant-service -> user-service: 3 попытки * 3 с + паузы ≈ 9,6 с
        timeout-duration: 12s
      userService:
        # user-service никуда не ходит, но логин/регистрация считают bcrypt
        timeout-duration: 5s
      dishPhoto:
        # загрузка файлов
        timeout-duration: 30s


eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL}
    # как часто забирать свежую копию реестра (дефолт 30 с)
    registry-fetch-interval-seconds: 10
  instance:
    # как часто шлём Eureka "я жив" (дефолт 30 с)
    lease-renewal-interval-in-seconds: 10
    # через сколько секунд без heartbeat нас считают мёртвым (дефолт 90 с) ≈ 3 пропущенных heartbeat'а
    lease-expiration-duration-in-seconds: 30

management:
  # Не трассируем внутренние шаги Spring Security — без них трейс запроса читается проще
  observations:
    enable:
      "[spring.security]": false
  # Гистограмма времени ответа: на дашборде появляются p50/p95/p99, а не только среднее
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
  # ---------- Распределённый трейсинг (Micrometer Tracing + OpenTelemetry -> Tempo) ----------
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}   # доля запросов, попадающих в трейсинг (1.0 = все)
  opentelemetry:
    resource-attributes:
      "[service.instance.id]": ${HOSTNAME:local}          # id реплики (в Docker = id контейнера)
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        enabled: false   # стартер OpenTelemetry умеет слать и метрики, но их у нас забирает Prometheus
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      show-details: always

---

spring:
  config:
    activate:
      on-profile: dev

logging:
  level:
    root: INFO
    my.project.apigateway: DEBUG
    org.springframework.security: INFO
    org.springframework.cloud.gateway: INFO
    reactor.netty.http.client: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%level] [%X{traceId:-},%X{spanId:-}] [%thread] %logger{36} - %msg%n"

---

spring:
  config:
    activate:
      on-profile: test

logging:
  level:
    root: WARN
    my.project.apigateway: WARN
    org.springframework.security: WARN
    org.springframework.cloud.gateway: WARN
    reactor.netty.http.client: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%level] [%X{traceId:-},%X{spanId:-}] [%thread] %logger{36} - %msg%n"

management:
  tracing:
    export:
      enabled: false   # в тестах спаны никуда не отправляем

---

spring:
  config:
    activate:
      on-profile: prod

logging:
  level:
    root: INFO
    my.project.apigateway: INFO
    org.springframework.security: WARN
    org.springframework.cloud.gateway: WARN
    reactor.netty.http.client: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%level] [%X{traceId:-},%X{spanId:-}] [%thread] %logger{36} - %msg%n"