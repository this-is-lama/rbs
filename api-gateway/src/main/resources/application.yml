server:
  port: 8080

jwt:
  access-secret: ${JWT_SECRET}
  issuer: user-service

app:
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN}

spring:
  reactor:
    context-propagation: auto   # traceId в MDC/логах для реактивного кода (WebFlux)

  application:
    name: api-gateway
  profiles:
    default: dev

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}


  cloud:
    loadbalancer:
      cache:
        enabled: true
        caffeine:
          spec: maximumSize=1000,expireAfterWrite=30s
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false

          default-filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@rateLimiterKeyResolver}"

          routes:
            - id: user-auth-route
              uri: lb://user-service
              predicates:
                - Path=/api/v1/auth/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 5
                    redis-rate-limiter.burstCapacity: 10
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@rateLimiterKeyResolver}"

            - id: user-route
              uri: lb://user-service
              predicates:
                - Path=/api/v1/users/**

            - id: restaurant-route
              uri: lb://restaurant-service
              predicates:
                - Path=/api/v1/restaurants/**

            - id: dish-photo-route
              uri: lb://restaurant-service
              predicates:
                - Path=/api/v1/dishes/**

            - id: booking-route
              uri: lb://booking-service
              predicates:
                - Path=/api/v1/bookings/**

            - id: notification-route
              uri: lb://notification-service
              predicates:
                - Path=/api/v1/notifications/**

          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:5173"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"
                allowCredentials: true


eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL}

management:
  # Не трассируем внутренние шаги Spring Security — без них трейс запроса читается проще
  observations:
    enable:
      "[spring.security]": false
  # Гистограмма времени ответа: на дашборде появляются p50/p95/p99, а не только среднее
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
  # ---------- Распределённый трейсинг (Micrometer Tracing + OpenTelemetry -> Tempo) ----------
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}   # доля запросов, попадающих в трейсинг (1.0 = все)
  opentelemetry:
    resource-attributes:
      "[service.instance.id]": ${HOSTNAME:local}          # id реплики (в Docker = id контейнера)
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        enabled: false   # стартер OpenTelemetry умеет слать и метрики, но их у нас забирает Prometheus
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      show-details: always

---

spring:
  config:
    activate:
      on-profile: dev

logging:
  level:
    root: INFO
    my.project.apigateway: DEBUG
    org.springframework.security: INFO
    org.springframework.cloud.gateway: INFO
    reactor.netty.http.client: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%level] [%X{traceId:-},%X{spanId:-}] [%thread] %logger{36} - %msg%n"

---

spring:
  config:
    activate:
      on-profile: test

logging:
  level:
    root: WARN
    my.project.apigateway: WARN
    org.springframework.security: WARN
    org.springframework.cloud.gateway: WARN
    reactor.netty.http.client: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%level] [%X{traceId:-},%X{spanId:-}] [%thread] %logger{36} - %msg%n"

management:
  tracing:
    export:
      enabled: false   # в тестах спаны никуда не отправляем

---

spring:
  config:
    activate:
      on-profile: prod

logging:
  level:
    root: INFO
    my.project.apigateway: INFO
    org.springframework.security: WARN
    org.springframework.cloud.gateway: WARN
    reactor.netty.http.client: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%level] [%X{traceId:-},%X{spanId:-}] [%thread] %logger{36} - %msg%n"