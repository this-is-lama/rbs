services:
  postgres-user:
    image: postgres:16
    restart: unless-stopped
    env_file: .env.infra
    environment:
      POSTGRES_DB: userdb
    ports:
      - "5433:5432"
    volumes:
      - pg_user_data:/var/lib/postgresql/data
    networks: [rbs-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-restaurant:
    image: postgres:16
    restart: unless-stopped
    env_file: .env.infra
    environment:
      POSTGRES_DB: restaurantdb
    ports:
      - "5434:5432"
    volumes:
      - pg_restaurant_data:/var/lib/postgresql/data
    networks: [rbs-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-booking:
    image: postgres:16
    restart: unless-stopped
    env_file: .env.infra
    environment:
      POSTGRES_DB: bookingdb
    ports:
      - "5435:5432"
    volumes:
      - pg_booking_data:/var/lib/postgresql/data
    networks: [rbs-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-notification:
    image: postgres:16
    restart: unless-stopped
    env_file: .env.infra
    environment:
      POSTGRES_DB: notificationdb
    ports:
      - "5436:5432"
    volumes:
      - pg_notification_data:/var/lib/postgresql/data
    networks: [rbs-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks: [rbs-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    env_file: .env.infra
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks: [rbs-net]

  minio-init:
    image: minio/mc:latest
    restart: "no"
    env_file: .env.infra
    depends_on:
      - minio
    networks: [rbs-net]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do
        echo 'waiting for minio...';
        sleep 2;
      done &&
      for bucket in $$MINIO_BUCKET restaurant-media dish-media; do
        echo \"creating bucket: $$bucket\";
        mc mb -p local/$$bucket || true;
        mc anonymous set download local/$$bucket || true;
      done
      "

  kafka:
    image: apache/kafka:latest
    restart: unless-stopped
    env_file: .env.infra
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks: [rbs-net]

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks: [rbs-net]


  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"     # хранить метрики 15 дней
      - "--storage.tsdb.retention.size=5GB"     # ...но не больше 5 ГБ на диске
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks: [ rbs-net ]

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    env_file: .env.infra   # GF_SECURITY_ADMIN_USER / GF_SECURITY_ADMIN_PASSWORD, TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    networks: [ rbs-net ]
    depends_on:
      - prometheus
      - loki
      - tempo

  node-exporter:
    image: prom/node-exporter:latest
    restart: unless-stopped
    command:
      - "--path.rootfs=/host"
    volumes:
      - /:/host:ro
    networks: [ rbs-net ]

  tempo:
    image: grafana/tempo:3.0.3
    restart: unless-stopped
    command: ["-target=all", "-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./monitoring/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"   # API Tempo (Grafana ходит внутри сети, порт — для отладки)
      - "4318:4318"   # OTLP HTTP: сюда сервисы шлют спаны (нужен, если сервисы запущены из IDE)
    networks: [ rbs-net ]

  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml
      - loki-data:/loki
    command:
      - "-config.file=/etc/loki/loki-config.yml"
    networks: [ rbs-net ]

  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    restart: unless-stopped
    ports:
      - "12345:12345"
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy
      - /var/run/docker.sock:/var/run/docker.sock
      - alloy-data:/var/lib/alloy/data
    command:
      - "run"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "--storage.path=/var/lib/alloy/data"
      - "/etc/alloy/config.alloy"
    depends_on:
      - loki
    networks: [ rbs-net ]

networks:
  rbs-net:
    name: rbs-net
    driver: bridge

volumes:
  pg_user_data:
  pg_restaurant_data:
  pg_booking_data:
  pg_notification_data:
  redis_data:
  minio_data:
  kafka_data:
  prometheus_data:
  grafana_data:
  loki-data:
  alloy-data:
  tempo_data:
