server:
  port: 0

jwt:
  access-secret: ${JWT_SECRET}
  refresh-secret: ${JWT_REFRESH_SECRET}
  access-lifetime: 1h
  refresh-lifetime: 1d
  issuer: user-service

spring:
  application:
    name: user-service
  profiles:
    default: dev

  cloud:
    loadbalancer:
      cache:
        enabled: true
        caffeine:
          spec: maximumSize=1000,expireAfterWrite=30s

  datasource:
    url: jdbc:postgresql://${USER_DB_HOST}:${USER_DB_PORT}/userdb
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${MAX_POOL_SIZE:25}
      minimum-idle: ${MIN_IDLE:5}
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 1800000

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL}
  instance:
    instance-id: ${spring.application.name}:${random.uuid}
    prefer-ip-address: true

management:
  # Не трассируем внутренние шаги Spring Security — без них трейс запроса читается проще
  observations:
    enable:
      "[spring.security]": false
  # Гистограмма времени ответа: на дашборде появляются p50/p95/p99, а не только среднее
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
  # ---------- Распределённый трейсинг (Micrometer Tracing + OpenTelemetry -> Tempo) ----------
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}   # доля запросов, попадающих в трейсинг (1.0 = все)
  opentelemetry:
    resource-attributes:
      "[service.instance.id]": ${HOSTNAME:local}          # id реплики (в Docker = id контейнера)
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        enabled: false   # стартер OpenTelemetry умеет слать и метрики, но их у нас забирает Prometheus
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

---

spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: INFO
    my.project.userservice: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%level] [%X{traceId:-},%X{spanId:-}] [%thread] %logger{36} - %msg%n"

---

spring:
  config:
    activate:
      on-profile: test
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    root: WARN
    my.project.userservice: WARN
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%level] [%X{traceId:-},%X{spanId:-}] [%thread] %logger{36} - %msg%n"

management:
  tracing:
    export:
      enabled: false   # в тестах спаны никуда не отправляем

---

spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    root: INFO
    my.project.userservice: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%level] [%X{traceId:-},%X{spanId:-}] [%thread] %logger{36} - %msg%n"
