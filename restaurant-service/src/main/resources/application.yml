server:
  port: 8081

jwt:
  access-secret: ${JWT_SECRET}
  issuer: user-service

spring:
  application:
    name: restaurant-service


  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/restaurantdb
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  cache:
    type: redis

minio:
  endpoint: ${MINIO_ENDPOINT}
  accessKey: ${MINIO_ROOT_USER}
  secretKey: ${MINIO_ROOT_PASSWORD}
  publicBaseUrl: ${MINIO_PUBLIC_BASE_URL}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
