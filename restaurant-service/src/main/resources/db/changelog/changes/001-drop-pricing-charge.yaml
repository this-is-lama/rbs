databaseChangeLog:
  - changeSet:
      id: 027-drop-restaurants-pricing-charge
      author: islam
      changes:
        - dropColumn:
            tableName: restaurants
            columns:
              - column: { name: min_pricing_charge }
              - column: { name: max_pricing_charge }
      rollback:
