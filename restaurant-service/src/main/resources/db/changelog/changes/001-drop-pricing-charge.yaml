            tableName: restaurants
            columns:
              - column: { name: min_pricing_charge, type: "NUMERIC(19,2)", defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: max_pricing_charge, type: "NUMERIC(19,2)", defaultValueNumeric: 0, constraints: { nullable: false } }
