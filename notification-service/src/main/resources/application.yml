server:
  port: 0

spring:
  application:
    name: notification-service
  profiles:
    default: dev

  cloud:
    loadbalancer:
      cache:
        enabled: true
        caffeine:
          spec: maximumSize=1000,expireAfterWrite=30s

  datasource:
    url: jdbc:postgresql://${NOTIFICATION_DB_HOST}:${NOTIFICATION_DB_PORT}/notificationdb
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${MAX_POOL_SIZE:25}
      minimum-idle: ${MIN_IDLE:5}
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 1800000


  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        order_updates: true
        jdbc:
          batch_size: 50

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}
            required: ${MAIL_SMTP_STARTTLS_REQUIRED:true}
          ssl:
            enable: ${MAIL_SMTP_SSL_ENABLE:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
        debug: ${MAIL_DEBUG:false}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP}
    consumer:
      group-id: my-consumer
      auto-offset-reset: earliest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: my.project.notificationservice.events.BookingCreatedEvent

app:
  kafka:
    topics:
      booking-created: booking-created-topic
      booking-cancelled: booking-cancelled-topic
  notification:
    max-attempts: 5

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL}
    # как часто забирать свежую копию реестра (дефолт 30 с)
    registry-fetch-interval-seconds: 10
  instance:
    instance-id: ${spring.application.name}:${random.uuid}
    prefer-ip-address: true
    # как часто шлём Eureka "я жив" (дефолт 30 с)
    lease-renewal-interval-in-seconds: 10
    # через сколько секунд без heartbeat нас считают мёртвым (дефолт 90 с) ≈ 3 пропущенных heartbeat'а
    lease-expiration-duration-in-seconds: 30

management:
  # Гистограмма времени ответа: на дашборде появляются p50/p95/p99, а не только среднее
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
  # ---------- Распределённый трейсинг (Micrometer Tracing + OpenTelemetry -> Tempo) ----------
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}   # доля запросов, попадающих в трейсинг (1.0 = все)
  opentelemetry:
    resource-attributes:
      "[service.instance.id]": ${HOSTNAME:local}          # id реплики (в Docker = id контейнера)
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        enabled: false   # стартер OpenTelemetry умеет слать и метрики, но их у нас забирает Prometheus
  health:
    mail:
      enabled: ${MANAGEMENT_HEALTH_MAIL_ENABLED:true}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

---

spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  mail:
    properties:
      mail:
        debug: false

logging:
  level:
    root: INFO
    my.project.notificationservice: DEBUG
    org.springframework.kafka: INFO
    org.springframework.mail: INFO
    org.hibernate.SQL: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%level] [%X{traceId:-},%X{spanId:-}] [%thread] %logger{36} - %msg%n"

---

spring:
  config:
    activate:
      on-profile: test
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  mail:
    properties:
      mail:
        debug: false

logging:
  level:
    root: WARN
    my.project.notificationservice: WARN
    org.springframework.kafka: WARN
    org.springframework.mail: WARN
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%level] [%X{traceId:-},%X{spanId:-}] [%thread] %logger{36} - %msg%n"

management:
  tracing:
    export:
      enabled: false   # в тестах спаны никуда не отправляем

---

spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  mail:
    properties:
      mail:
        debug: false

logging:
  level:
    root: INFO
    my.project.notificationservice: INFO
    org.springframework.kafka: WARN
    org.springframework.mail: WARN
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%level] [%X{traceId:-},%X{spanId:-}] [%thread] %logger{36} - %msg%n"