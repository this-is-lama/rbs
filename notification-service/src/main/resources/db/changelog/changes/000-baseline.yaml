databaseChangeLog:
  - changeSet:
      id: 001-create-processed-messages-table
      author: islam
      changes:
        - createTable:
            tableName: processed_messages
            columns:
              - column: { name: message_id, type: UUID, constraints: { primaryKey: true, primaryKeyName: processed_messages_pkey, nullable: false } }
              - column: { name: message_type, type: VARCHAR(50) }
              - column: { name: status, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: json_message, type: TEXT, constraints: { nullable: false } }
              - column: { name: attempts, type: INT, constraints: { nullable: false } }
              - column: { name: created_at, type: TIMESTAMP WITH TIME ZONE, constraints: { nullable: false } }
              - column: { name: updated_at, type: TIMESTAMP WITH TIME ZONE, constraints: { nullable: false } }
      rollback:
        - dropTable: { tableName: processed_messages }

  - changeSet:
      id: 002-add-processed-messages-status-updated-index
      author: islam
      changes:
        - createIndex:
            tableName: processed_messages
            indexName: idx_processed_messages_status_updated_at
            columns: [ { column: { name: status } }, { column: { name: updated_at } } ]
      rollback:
        - dropIndex: { tableName: processed_messages, indexName: idx_processed_messages_status_updated_at }

  - changeSet:
      id: 003-add-processed-messages-status-attempts-updated-index
      author: islam
      changes:
        - createIndex:
            tableName: processed_messages
            indexName: idx_processed_messages_status_attempts_updated_at
            columns: [ { column: { name: status } }, { column: { name: attempts } }, { column: { name: updated_at } } ]
      rollback:
        - dropIndex: { tableName: processed_messages, indexName: idx_processed_messages_status_attempts_updated_at }

  - changeSet:
      id: 004-add-processed-messages-type-created-index
      author: islam
      changes:
        - createIndex:
            tableName: processed_messages
            indexName: idx_processed_messages_type_created_at
            columns: [ { column: { name: message_type } }, { column: { name: created_at } } ]
      rollback:
        - dropIndex: { tableName: processed_messages, indexName: idx_processed_messages_type_created_at }
