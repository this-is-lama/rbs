apiVersion: 1

datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    jsonData:
      # traceId из строки лога "[<traceId>,<spanId>]" превращается в кнопку «Открыть трейс» (Tempo)
      derivedFields:
        - name: traceId
          matcherRegex: '\[([0-9a-f]{32}),'
          datasourceUid: tempo
          url: '$${__value.raw}'
          urlDisplayLabel: Открыть трейс
